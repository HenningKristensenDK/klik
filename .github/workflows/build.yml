name: Build

# Every push and pull request: test and build the Windows installer.
# Publish a GitHub Release with the installer and the Claude extension by either
# - running this workflow by hand (Actions > Build > Run workflow) with a version, or
# - pushing a tag like v0.1.5.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish, e.g. 0.1.5. Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            mcp
            app/src-tauri

      - name: Test klik-mcp
        working-directory: mcp
        run: cargo test

      - name: Build klik-mcp
        working-directory: mcp
        run: cargo build --release

      - name: Add klik-mcp to the app bundle and the Claude extension
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force app/src-tauri/binaries, mcp/mcpb/server | Out-Null
          Copy-Item mcp/target/release/klik-mcp.exe app/src-tauri/binaries/klik-mcp-x86_64-pc-windows-msvc.exe
          Copy-Item mcp/target/release/klik-mcp.exe mcp/mcpb/server/klik-mcp.exe

      - name: Pack Claude Desktop extension
        working-directory: mcp/mcpb
        run: |
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json
          npx -y @anthropic-ai/mcpb@2.1.2 pack . Klik.mcpb

      - name: Build Klik
        working-directory: app
        run: |
          npm ci
          npm run typecheck
          npx tauri build

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $exe = Get-ChildItem app/src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Copy-Item $exe.FullName out/
          # A name without the version, so the README link always points at the newest installer.
          Copy-Item $exe.FullName out/Klik-setup.exe
          Copy-Item mcp/mcpb/Klik.mcpb out/

      - uses: actions/upload-artifact@v4
        with:
          name: Klik-windows
          path: out/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release != '' && format('v{0}', inputs.release) || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: Klik ${{ inputs.release != '' && format('v{0}', inputs.release) || github.ref_name }}
          generate_release_notes: true
          files: out/*
